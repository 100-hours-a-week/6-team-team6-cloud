services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.50.0}
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${RETENTION_TIME:-15d}'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.3.0}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  loki:
    image: grafana/loki:${LOKI_VERSION:-2.9.0}
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring

  rds-mysql-exporter-dev:
    image: prom/mysqld-exporter:v0.16.0
    container_name: rds-mysql-exporter-dev
    restart: unless-stopped
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${RDS_EXPORTER_PASSWORD}
    command:
      - '--mysqld.username=${RDS_EXPORTER_USER}'
      - '--mysqld.address=${RDS_DEV_ENDPOINT}'
      - '--web.listen-address=:9104'
    networks:
      - monitoring

  rds-mysql-exporter-prod:
    image: prom/mysqld-exporter:v0.16.0
    container_name: rds-mysql-exporter-prod
    restart: unless-stopped
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${RDS_EXPORTER_PASSWORD}
    command:
      - '--mysqld.username=${RDS_EXPORTER_USER}'
      - '--mysqld.address=${RDS_PROD_ENDPOINT}'
      - '--web.listen-address=:9104'
    networks:
      - monitoring

  yace:
    image: quay.io/prometheuscommunity/yet-another-cloudwatch-exporter:v0.63.0
    container_name: yace
    restart: unless-stopped
    command:
      - '--config.file=/config/config.yml'
    volumes:
      - ./configs/yace/config.yml:/config/config.yml:ro
    environment:
      - AWS_REGION=${YACE_AWS_REGION:-ap-northeast-2}
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
