version: '3.8'

# ==========================================
# 모니터링 서버용 Docker Compose
# Prometheus + Grafana + InfluxDB + Exporters
# ==========================================

services:
  # ==========================================
  # Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring-net

  # ==========================================
  # InfluxDB (K6 메트릭)
  # ==========================================
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_DATA_MAX_SERIES_PER_DATABASE: "0"
      INFLUXDB_RETENTION_ENABLED: "true"
      INFLUXDB_RETENTION_CHECK_INTERVAL: "30m"
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb/init.iql:/docker-entrypoint-initdb.d/init.iql:ro
    restart: unless-stopped
    networks:
      - monitoring-net

  # ==========================================
  # Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:11.1.5
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - influxdb
    restart: unless-stopped
    networks:
      - monitoring-net

  # ==========================================
  # Blackbox Exporter (HTTP synthetic probe)
  # ==========================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    restart: unless-stopped
    networks:
      - monitoring-net

  # ==========================================
  # MySQL Exporter (RDS target - external scrape)
  # ==========================================
  mysqld-exporter-rds:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter-rds
    ports:
      - "9105:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${RDS_EXPORTER_PASSWORD}"
    command:
      - '--mysqld.address=${RDS_HOST}:${RDS_PORT:-3306}'
      - '--mysqld.username=${RDS_EXPORTER_USER}'
    restart: unless-stopped
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  prometheus-data:
  influxdb-data:
  grafana-data:
