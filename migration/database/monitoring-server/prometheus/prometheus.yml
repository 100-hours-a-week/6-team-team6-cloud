# ==========================================
# Prometheus Configuration
# DB 마이그레이션 모니터링용
# ==========================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

# ==========================================
# Alerting (Optional)
# ==========================================
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts/*.yml

# ==========================================
# Scrape Configs
# ==========================================
scrape_configs:
  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # EC2 Source Server - MySQL Exporter
  # targets file 예시: /etc/prometheus/targets/mysql-source.yml
  - job_name: 'mysql-source'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/mysql-source.yml']

  # EC2 Source Server - Node Exporter
  - job_name: 'node-source'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node-source.yml']

  # EC2 Source Server - Nginx Exporter
  - job_name: 'nginx-source'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/nginx-source.yml']

  # RDS MySQL - External mysqld_exporter (monitoring 서버에서 수집)
  - job_name: 'mysql-rds'
    static_configs:
      - targets: ['mysqld-exporter-rds:9104']
        labels:
          instance: 'mysql-rds'
          role: 'target'

  # Blackbox Probe (핵심 엔드포인트 synthetic monitoring)
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/probe-targets.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Blackbox Exporter 자체 메트릭
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  # InfluxDB (K6 메트릭 저장소)
  - job_name: 'influxdb'
    static_configs:
      - targets: ['influxdb:8086']
