# ==========================================
# Migration Alert Rules
# ==========================================

groups:
  - name: migration-alerts
    rules:
      # MySQL 복제 지연 경고
      - alert: MySQLReplicationLag
        expr: mysql_slave_status_seconds_behind_master{instance=~"mysql-rds|.*target.*"} > 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "MySQL replication lag detected"
          description: "Replication lag is {{ $value }}s on {{ $labels.instance }}"

      # MySQL 복제 지연 위험
      - alert: MySQLReplicationLagCritical
        expr: mysql_slave_status_seconds_behind_master{instance=~"mysql-rds|.*target.*"} > 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical MySQL replication lag"
          description: "Replication lag is {{ $value }}s on {{ $labels.instance }}"

      # MySQL 복제 중단
      - alert: MySQLReplicationStopped
        expr: mysql_slave_status_slave_io_running{instance=~"mysql-rds|.*target.*"} == 0 or mysql_slave_status_slave_sql_running{instance=~"mysql-rds|.*target.*"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MySQL replication stopped"
          description: "Replication is not running on {{ $labels.instance }}"

      # MySQL 커넥션 고갈
      - alert: MySQLConnectionsHigh
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "MySQL connections running high"
          description: "{{ $value | humanizePercentage }} of max connections used"

      # 핵심 API 5xx 감지 (blackbox probe 기반)
      - alert: API5xxDetected
        expr: max_over_time(probe_http_status_code[1m]) >= 500
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "API returned 5xx"
          description: "Probe observed HTTP {{ $value }} on {{ $labels.instance }}"

      # RDS exporter 연결 실패
      - alert: RDSMySQLExporterDown
        expr: mysql_up{instance="mysql-rds"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RDS mysql exporter cannot connect"
          description: "mysqld_exporter cannot reach RDS on {{ $labels.instance }}"

      # 핵심 API 블랙박스 프로브 실패
      - alert: APISyntheticProbeFailed
        expr: probe_success == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API synthetic probe failed"
          description: "Blackbox probe failed for {{ $labels.instance }}"

      # 핵심 API 응답 지연
      - alert: APISyntheticProbeSlow
        expr: probe_duration_seconds > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API synthetic probe slow"
          description: "Probe duration {{ $value }}s on {{ $labels.instance }}"

      # 시스템 CPU 높음
      - alert: HighCPUUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      # 시스템 메모리 높음
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"
