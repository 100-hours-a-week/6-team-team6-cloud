# ==========================================
# Grafana Dashboard Provisioning
# ==========================================

apiVersion: 1

providers:
  - name: 'Migration Dashboards'
    orgId: 1
    folder: 'Migration'
    folderUid: 'migration'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards