version: '3.8'

# ==========================================
# 부하 생성 서버용 Docker Compose
# K6 only (메트릭은 중앙 모니터링 InfluxDB로 전송)
# ==========================================

services:
  # ==========================================
  # K6 Load Testing
  # ==========================================
  k6:
    image: grafana/k6:0.49.0
    container_name: k6-load-tester
    volumes:
      - ./k6:/scripts
    environment:
      # 예시: influxdb=http://10.0.10.25:8086/k6
      - K6_OUT=${K6_OUT:?Set K6_OUT to monitoring InfluxDB endpoint}
      - TARGET_URL=${TARGET_URL:?Set TARGET_URL}
      - WS_URL=${WS_URL:-}
      - GROUP_ID=${GROUP_ID:-1}
      - ENABLE_WS=${ENABLE_WS:-true}
      - STRICT_THRESHOLDS=${STRICT_THRESHOLDS:-true}
      - WS_SUCCESS_REQUIRES_MEMBERSHIP=${WS_SUCCESS_REQUIRES_MEMBERSHIP:-false}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # HTTPS 리다이렉트 + 내부 IP 인증서 환경 대응
      - K6_INSECURE_SKIP_TLS_VERIFY=${K6_INSECURE_SKIP_TLS_VERIFY:-true}
      # 회원가입/로그인 토큰 풀 + 그룹/게시글 seed
      - USER_POOL_SIZE=${USER_POOL_SIZE:-120}
      - SELLER_POOL_SIZE=${SELLER_POOL_SIZE:-30}
      - USER_PASSWORD=${USER_PASSWORD:-Qwer1234!}
      - SEED_POSTS_PER_SELLER=${SEED_POSTS_PER_SELLER:-6}
      - REPLACE_AFTER_DELETE=${REPLACE_AFTER_DELETE:-true}
      # setup 우회(사전 발급 토큰 재사용) 모드
      - SKIP_SETUP=${SKIP_SETUP:-false}
      - PRESET_USERS_JSON=${PRESET_USERS_JSON:-}
      - PRESET_USERS_FILE=${PRESET_USERS_FILE:-}
      - PRESET_TOKEN_LIST=${PRESET_TOKEN_LIST:-}
      - SKIP_SEED_POSTS=${SKIP_SEED_POSTS:-false}
      - SKIP_SEED_CHATROOMS=${SKIP_SEED_CHATROOMS:-false}
      # 혼합 트래픽 비율
      - ACTION_READ_LIST_RATIO=${ACTION_READ_LIST_RATIO:-0.25}
      - ACTION_READ_DETAIL_RATIO=${ACTION_READ_DETAIL_RATIO:-0.20}
      - ACTION_READ_PROFILE_RATIO=${ACTION_READ_PROFILE_RATIO:-0.10}
      - ACTION_READ_MESSAGES_RATIO=${ACTION_READ_MESSAGES_RATIO:-0.05}
      - ACTION_CREATE_POST_RATIO=${ACTION_CREATE_POST_RATIO:-0.15}
      - ACTION_UPDATE_POST_RATIO=${ACTION_UPDATE_POST_RATIO:-0.10}
      - ACTION_PATCH_STATUS_RATIO=${ACTION_PATCH_STATUS_RATIO:-0.08}
      - ACTION_DELETE_POST_RATIO=${ACTION_DELETE_POST_RATIO:-0.02}
      - ACTION_CREATE_CHATROOM_RATIO=${ACTION_CREATE_CHATROOM_RATIO:-0.05}
      # HTTP 부하
      - HTTP_RPS_MIN=${HTTP_RPS_MIN:-300}
      - HTTP_RPS_MID=${HTTP_RPS_MID:-450}
      - HTTP_RPS_MAX=${HTTP_RPS_MAX:-600}
      - HTTP_STAGE_1=${HTTP_STAGE_1:-5m}
      - HTTP_STAGE_2=${HTTP_STAGE_2:-10m}
      - HTTP_STAGE_3=${HTTP_STAGE_3:-10m}
      - HTTP_PRE_ALLOCATED_VUS=${HTTP_PRE_ALLOCATED_VUS:-600}
      - HTTP_MAX_VUS=${HTTP_MAX_VUS:-2000}
      # 임계치
      - MAX_ERROR_RATE=${MAX_ERROR_RATE:-0.001}
      - MAX_WRITE_BLOCK_RATE=${MAX_WRITE_BLOCK_RATE:-0.01}
      - MAX_UNEXPECTED_WRITE_FAILURE_RATE=${MAX_UNEXPECTED_WRITE_FAILURE_RATE:-0.01}
      - MAX_DOWNTIME_ERROR_RATE=${MAX_DOWNTIME_ERROR_RATE:-0.01}
      - HTTP_P95_THRESHOLD_MS=${HTTP_P95_THRESHOLD_MS:-500}
      - WRITE_BLOCK_HEADER_NAME=${WRITE_BLOCK_HEADER_NAME:-X-Migration-Write-Block}
      - WRITE_BLOCK_HEADER_VALUE=${WRITE_BLOCK_HEADER_VALUE:-soft-freeze}
      # WS 채팅 부하
      - WS_VUS=${WS_VUS:-120}
      - WS_DURATION=${WS_DURATION:-25m}
      - WS_SESSION_SEC=${WS_SESSION_SEC:-20}
      - WS_MESSAGE_INTERVAL_MS=${WS_MESSAGE_INTERVAL_MS:-500}
      - WS_USER_POOL_SIZE=${WS_USER_POOL_SIZE:-120}
      # warmup 전용
      - WARMUP_TARGET_URL=${WARMUP_TARGET_URL:-}
      - WARMUP_GROUP_ID=${WARMUP_GROUP_ID:-}
      - WARMUP_AUTH_TOKEN=${WARMUP_AUTH_TOKEN:-}
      - WARMUP_RPS=${WARMUP_RPS:-20}
      - WARMUP_DURATION=${WARMUP_DURATION:-2m}
      - WARMUP_TIMEOUT=${WARMUP_TIMEOUT:-15s}
      - WARMUP_PRE_ALLOCATED_VUS=${WARMUP_PRE_ALLOCATED_VUS:-30}
      - WARMUP_MAX_VUS=${WARMUP_MAX_VUS:-120}
      - WARMUP_MAX_ERROR_RATE=${WARMUP_MAX_ERROR_RATE:-0.01}
      - WARMUP_P95_MS=${WARMUP_P95_MS:-1000}
      # cutover monitor 전용
      - CUTOVER_TARGET_URL=${CUTOVER_TARGET_URL:-}
      - CUTOVER_GROUP_ID=${CUTOVER_GROUP_ID:-}
      - CUTOVER_AUTH_TOKEN=${CUTOVER_AUTH_TOKEN:-}
      - CUTOVER_USER_PASSWORD=${CUTOVER_USER_PASSWORD:-Qwer1234!}
      - CUTOVER_RPS=${CUTOVER_RPS:-300}
      - CUTOVER_DURATION=${CUTOVER_DURATION:-10m}
      - CUTOVER_TIMEOUT=${CUTOVER_TIMEOUT:-5s}
      - CUTOVER_DOWNTIME_PROBE_INTERVAL_MS=${CUTOVER_DOWNTIME_PROBE_INTERVAL_MS:-200}
      - CUTOVER_INCLUDE_WRITE_PROBE=${CUTOVER_INCLUDE_WRITE_PROBE:-true}
      - CUTOVER_WRITE_PROBE_RATIO=${CUTOVER_WRITE_PROBE_RATIO:-0.3}
      - CUTOVER_MAX_ERROR_RATE=${CUTOVER_MAX_ERROR_RATE:-0.05}
      - CUTOVER_MAX_WRITE_BLOCK_RATE=${CUTOVER_MAX_WRITE_BLOCK_RATE:-1.0}
      - CUTOVER_MAX_UNPLANNED_DOWNTIME_MS=${CUTOVER_MAX_UNPLANNED_DOWNTIME_MS:-5000}
      - CUTOVER_P95_MS=${CUTOVER_P95_MS:-3000}
      - CUTOVER_WRITE_BLOCK_HEADER_NAME=${CUTOVER_WRITE_BLOCK_HEADER_NAME:-}
      - CUTOVER_WRITE_BLOCK_HEADER_VALUE=${CUTOVER_WRITE_BLOCK_HEADER_VALUE:-}
    # 기본적으로 대기 상태로 유지, 직접 실행 명령 사용
    entrypoint: ["tail", "-f", "/dev/null"]
