# ==========================================
# Upstream: Target (RDS 연결 앱)
# 전환 후 사용
#
# 단일 EC2 환경:
#   - Nginx (:80) → Spring Boot (:8081) → RDS MySQL
# ==========================================

upstream backend {
    # Target DB(RDS)를 사용하는 Spring Boot 앱
    # 같은 EC2 내에서 다른 포트로 실행 중
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;

    # Connection pooling
    keepalive 32;
}