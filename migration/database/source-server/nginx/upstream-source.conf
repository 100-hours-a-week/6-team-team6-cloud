# ==========================================
# Upstream: Source (로컬 MySQL 연결 앱)
# 전환 전/롤백 시 사용
#
# 단일 EC2 환경:
#   - Nginx (:80) → Spring Boot (:8080) → 로컬 MySQL (:3306)
# ==========================================

upstream backend {
    # Source DB(로컬 MySQL)를 사용하는 Spring Boot 앱
    # 같은 EC2 내에서 실행 중
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;

    # Connection pooling
    keepalive 32;
}