version: '3.8'

# ==========================================
# EC2 Source Server용 Exporters
# Prometheus가 수집할 메트릭 노출
# ==========================================

services:
  # ==========================================
  # MySQL Exporter
  # ==========================================
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    ports:
      - "9104:9104"
    environment:
      # MySQL 연결 정보 (환경변수로 전달)
      DATA_SOURCE_NAME: "${MYSQL_USER:-root}:${MYSQL_PASSWORD}@(${MYSQL_HOST:-localhost}:${MYSQL_PORT:-3306})/"
    restart: unless-stopped
    network_mode: host

  # ==========================================
  # Nginx Exporter
  # ==========================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    ports:
      - "9113:9113"
    command:
      - '-nginx.scrape-uri=http://127.0.0.1/nginx_status'
    restart: unless-stopped
    network_mode: host

  # ==========================================
  # Node Exporter (시스템 메트릭)
  # ==========================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    network_mode: host